<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — The Highlight Reel</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
  <script>if (THRAuth.currentUser()) location.replace("app.html");</script>
</head>
<body>
  <a class="skip" href="#login">Skip to log in</a>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="The Highlight Reel" width="248" height="40"></a>
    <nav class="nav-cta" aria-label="Account"><a class="btn btn-primary" href="signup.html">Sign up free</a></nav>
  </header>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1 id="login">Log in</h1>
      <p class="lede">Use the email and password from this browser. Demo accounts stay on this device.</p>
      <form id="form" novalidate>
        <label>Email
          <input id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-error">
        </label>
        <p class="error" id="email-error" role="alert"></p>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
        </label>
        <p class="error" id="password-error" role="alert"></p>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p class="switch-auth">New here? <a href="signup.html">Sign up free</a></p>
    </div>
  </main>
  <script>
    var form = document.getElementById("form");
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      ["email", "password"].forEach(function (id) {
        document.getElementById(id + "-error").textContent = "";
        document.getElementById(id).removeAttribute("aria-invalid");
      });
      var button = form.querySelector("button");
      button.disabled = true;
      THRAuth.logIn({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      }).then(function (result) {
        button.disabled = false;
        if (!result.ok) {
          var slot = document.getElementById((result.field || "email") + "-error");
          if (slot) slot.textContent = result.error;
          var input = document.getElementById(result.field);
          if (input) {
            input.setAttribute("aria-invalid", "true");
            input.focus();
          }
          return;
        }
        location.href = THRAuth.hasFavorites(result.user) ? "app.html" : "onboarding.html";
      });
    });
  </script>
</body>
</html>
